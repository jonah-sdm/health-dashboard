<!DOCTYPE html>
<html lang="en" data-theme="calm" data-mode="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16201c" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Vitals — a private, local-first personal health dashboard." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Vitals — Personal Health Dashboard</title>
  <style>
/* ============================================================
   Vitals — design tokens + theme system
   Three aesthetics (calm / warm / vivid) × light/dark, accent override.
   Set on <html>: data-theme="calm|warm|vivid", data-mode="light|dark"
   Accent override: --accent-override on :root (cleared = theme default)
   ============================================================ */

/* ---------- Fonts ---------- */
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
::selection { background: var(--accent); color: var(--accent-fg); }

/* scrollbars */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid var(--bg); }
*::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   THEME: CALM CLINICAL  (default) — cool, precise, airy
   ============================================================ */
:root,
:root[data-theme="calm"] {
  --font-ui: 'Hanken Grotesk', system-ui, sans-serif;
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --display-weight: 400;
  --display-style: normal;

  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f5f8f7;
  --surface-3: #eaf0ee;
  --border: #e2e9e6;
  --border-strong: #cdd8d4;
  --text: #16201c;
  --text-2: #51635c;
  --text-3: #859790;

  --accent-default: #2f8f7f;
  --accent-fg: #ffffff;

  --ok: #2e9e6b;      --ok-weak: #e6f4ec;
  --watch: #c6892b;   --watch-weak: #f7eed9;
  --high: #d8543d;    --high-weak: #fbe7e1;
  --low: #3b82c4;     --low-weak: #e4eef8;
  --benign: #7c8b9a;  --benign-weak: #eef1f4;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 1px 2px rgba(20,40,34,.04), 0 4px 16px rgba(20,40,34,.04);
  --shadow-lg: 0 2px 6px rgba(20,40,34,.06), 0 18px 48px rgba(20,40,34,.10);
  --shadow-pop: 0 12px 40px rgba(20,40,34,.14);
  --grid-tex: 0;
}

/* ============================================================
   THEME: WARM HUMAN — ivory, rounded, bookish
   ============================================================ */
:root[data-theme="warm"] {
  --font-ui: 'Hanken Grotesk', system-ui, sans-serif;
  --font-display: 'Newsreader', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --display-weight: 500;
  --display-style: normal;

  --bg: #efe7da;
  --surface: #fbf7f0;
  --surface-2: #f4ece0;
  --surface-3: #ece0cf;
  --border: #e6d8c4;
  --border-strong: #d8c4a8;
  --text: #2c2418;
  --text-2: #6b5d49;
  --text-3: #9a8b73;

  --accent-default: #c2683f;
  --accent-fg: #fff8f0;

  --ok: #6a8f3c;      --ok-weak: #edf1df;
  --watch: #c08a2e;   --watch-weak: #f6ecd6;
  --high: #c4543a;    --high-weak: #f7e3da;
  --low: #4d7ba0;     --low-weak: #e6eef3;
  --benign: #9c8a73;  --benign-weak: #efe7da;

  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 24px;
  --shadow: 0 1px 2px rgba(80,55,25,.05), 0 6px 20px rgba(80,55,25,.06);
  --shadow-lg: 0 3px 8px rgba(80,55,25,.07), 0 20px 50px rgba(80,55,25,.12);
  --shadow-pop: 0 14px 44px rgba(80,55,25,.16);
  --grid-tex: 0;
}

/* ============================================================
   THEME: VIVID DATA — cool light, saturated, gradient stats
   ============================================================ */
:root[data-theme="vivid"] {
  --font-ui: 'Hanken Grotesk', system-ui, sans-serif;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --display-weight: 600;
  --display-style: normal;

  --bg: #eef0f7;
  --surface: #ffffff;
  --surface-2: #f3f5fb;
  --surface-3: #e9edf8;
  --border: #e4e8f3;
  --border-strong: #ccd4ea;
  --text: #14171f;
  --text-2: #535a6b;
  --text-3: #8b93a7;

  --accent-default: #5b5bf0;
  --accent-fg: #ffffff;

  --ok: #14a06b;      --ok-weak: #e0f5ec;
  --watch: #e0941f;   --watch-weak: #fbeed6;
  --high: #ec5a52;    --high-weak: #fde4e2;
  --low: #3f7fe6;     --low-weak: #e2ecfd;
  --benign: #7e87a0;  --benign-weak: #ebeef6;

  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --shadow: 0 1px 2px rgba(30,35,70,.04), 0 8px 28px rgba(30,35,70,.07);
  --shadow-lg: 0 4px 10px rgba(30,35,70,.08), 0 24px 60px rgba(30,35,70,.14);
  --shadow-pop: 0 16px 48px rgba(30,35,70,.18);
  --grid-tex: 0;
}

/* ============================================================
   DARK MODE — applied on top of any theme
   ============================================================ */
:root[data-mode="dark"] {
  --bg: #0e1411;
  --surface: #161d1a;
  --surface-2: #1c2521;
  --surface-3: #232e29;
  --border: #28332e;
  --border-strong: #36443d;
  --text: #eaf1ed;
  --text-2: #9db0a8;
  --text-3: #6c7d76;
  --accent-fg: #0e1411;

  --ok: #4dc78a;      --ok-weak: #14271d;
  --watch: #e0a64a;   --watch-weak: #2c2413;
  --high: #f0705c;    --high-weak: #2e1a16;
  --low: #5e9fe0;     --low-weak: #16222e;
  --benign: #8fa0ab;  --benign-weak: #1d2630;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.45), 0 26px 64px rgba(0,0,0,.5);
  --shadow-pop: 0 18px 52px rgba(0,0,0,.6);
}
:root[data-mode="dark"][data-theme="warm"] {
  --bg: #16110b;
  --surface: #1f1810;
  --surface-2: #261d13;
  --surface-3: #2f2417;
  --border: #322619;
  --border-strong: #443420;
  --text: #f3ebdd;
  --text-2: #b7a589;
  --text-3: #897a63;
}
:root[data-mode="dark"][data-theme="vivid"] {
  --bg: #0c0e16;
  --surface: #14161f;
  --surface-2: #1a1d28;
  --surface-3: #212433;
  --border: #262a39;
  --border-strong: #353a4f;
  --text: #eef0f8;
  --text-2: #a3aabf;
  --text-3: #6f7791;
  --accent-fg: #ffffff;
}

/* ---------- Resolved accent (override beats theme default) ---------- */
:root {
  --accent: var(--accent-override, var(--accent-default));
  --accent-weak: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --accent-soft: color-mix(in srgb, var(--accent) 8%, var(--surface));
  --accent-line: color-mix(in srgb, var(--accent) 32%, var(--border));
  --on-accent-soft: color-mix(in srgb, var(--accent) 72%, var(--text));
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
  transition: background .4s var(--ease, ease);
}
:root { --ease: cubic-bezier(.2,.7,.2,1); }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: 0; height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 22px 16px;
  gap: 4px;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 6px 8px 20px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; flex: none;
  box-shadow: var(--shadow);
}
.brand-mark svg { width: 19px; height: 19px; }
.brand-name { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 23px; letter-spacing: .01em; line-height: 1; }
.brand-sub { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-3); margin-top: 3px; font-weight: 600; white-space: nowrap; }

.nav-group-label { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 16px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 11px; border-radius: var(--radius-sm);
  color: var(--text-2); font-size: 14px; font-weight: 500;
  width: 100%; text-align: left; position: relative; white-space: nowrap;
  transition: background .15s, color .15s;
}
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-weak); color: var(--on-accent-soft); font-weight: 600; }
.nav-item.active svg { opacity: 1; color: var(--accent); }
.nav-badge {
  margin-left: auto; font-size: 11px; font-weight: 700; font-family: var(--font-mono);
  background: var(--high-weak); color: var(--high);
  padding: 1px 7px; border-radius: 20px; min-width: 20px; text-align: center;
}
.nav-spacer { flex: 1; }
.nav-foot {
  border-top: 1px solid var(--border); padding-top: 14px; margin-top: 8px;
  display: flex; align-items: center; gap: 11px; padding-left: 8px;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 50%, var(--text)));
  color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px;
}

/* ---------- Main / topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 18px;
  padding: 18px 36px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.page-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 27px; line-height: 1.05; letter-spacing: .005em; white-space: nowrap; }
.page-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.topbar-spacer { flex: 1; }
.content { padding: 28px 36px 64px; max-width: 1320px; width: 100%; }

/* ---------- Generic search ---------- */
.search {
  display: flex; align-items: center; gap: 9px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 13px; min-width: 230px;
  color: var(--text-3);
}
.search svg { width: 16px; height: 16px; }
.search input { border: none; background: none; outline: none; color: var(--text); font-size: 13.5px; width: 100%; }
.search input::placeholder { color: var(--text-3); }

/* ============================================================
   PRIMITIVES — cards, buttons, badges, pills
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.card-title { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  padding: 9px 15px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  transition: transform .08s, background .15s, border-color .15s, opacity .15s;
}
.btn svg { width: 15px; height: 15px; }
.btn:hover { background: var(--surface-2); border-color: var(--text-3); }
.btn:active { transform: translateY(1px); opacity: .9; }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: transparent; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { padding: 6px 11px; font-size: 12.5px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  letter-spacing: .01em; white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; }
.badge-ok      { background: var(--ok-weak);     color: var(--ok); }
.badge-watch   { background: var(--watch-weak);  color: var(--watch); }
.badge-high    { background: var(--high-weak);   color: var(--high); }
.badge-low     { background: var(--low-weak);    color: var(--low); }
.badge-benign  { background: var(--benign-weak); color: var(--benign); }
.badge-accent  { background: var(--accent-weak); color: var(--on-accent-soft); }
.dot-ok{background:var(--ok)} .dot-watch{background:var(--watch)} .dot-high{background:var(--high)} .dot-low{background:var(--low)} .dot-benign{background:var(--benign)}

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  transition: all .15s;
}
.chip:hover { border-color: var(--text-3); color: var(--text); }
.chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-display); font-weight: var(--display-weight); }

/* ---------- progress bar ---------- */
.bar { height: 7px; border-radius: 20px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 20px; transition: width .6s var(--ease); }

/* ---------- page enter animation ---------- */
@media (prefers-reduced-motion: no-preference) {
  .stagger > * { opacity: 0; transform: translateY(14px); animation: rise .55s var(--ease) forwards; }
  .stagger > *:nth-child(1){animation-delay:.02s} .stagger > *:nth-child(2){animation-delay:.06s}
  .stagger > *:nth-child(3){animation-delay:.10s} .stagger > *:nth-child(4){animation-delay:.14s}
  .stagger > *:nth-child(5){animation-delay:.18s} .stagger > *:nth-child(6){animation-delay:.22s}
  .stagger > *:nth-child(7){animation-delay:.26s} .stagger > *:nth-child(8){animation-delay:.30s}
  .stagger > *:nth-child(9){animation-delay:.34s} .stagger > *:nth-child(10){animation-delay:.38s}
  @keyframes rise { to { opacity: 1; transform: none; } }
}

/* ---------- utility ---------- */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.grow{flex:1}.wrap{flex-wrap:wrap}
.muted{color:var(--text-2)}.muted3{color:var(--text-3)}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; bottom: 0; top: auto; height: auto; width: 100%;
    flex-direction: row; padding: 8px; border-right: none; border-top: 1px solid var(--border);
    z-index: 50; overflow-x: auto; gap: 2px;
  }
  .brand, .nav-group-label, .nav-spacer, .nav-foot, .nav-badge { display: none; }
  .nav-item { flex-direction: column; gap: 4px; font-size: 10px; padding: 8px 10px; white-space: nowrap; min-width: 64px; }
  .nav-item svg { width: 20px; height: 20px; }
  .content { padding: 18px 16px 90px; }
  .topbar { padding: 14px 16px; }
}

  </style>
  <style>
/* ============================================================
   Vitals — component styles (pages)
   ============================================================ */

/* ---------- icon helper ---------- */
.ico { display: inline-grid; place-items: center; }
.ico svg { width: 100%; height: 100%; display: block; }
.ico-pad {
  border-radius: var(--radius-sm); background: var(--surface-2);
  display: grid; place-items: center; color: var(--text-2);
}

/* ============================================================
   OVERVIEW
   ============================================================ */
.ov-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 1100px){ .ov-grid { grid-template-columns: 1fr; } }

/* hero summary band */
.summary {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 26px 28px;
  box-shadow: var(--shadow);
}
.summary-glow {
  position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: radial-gradient(420px 220px at 88% -10%, var(--accent-weak), transparent 70%);
}
.summary .big {
  font-family: var(--font-display); font-weight: var(--display-weight);
  font-size: clamp(54px, 7vw, 84px); line-height: .92; letter-spacing: -.01em;
}
.summary .big .slash { color: var(--text-3); }
.summary .big .denom { color: var(--text-2); font-size: .5em; }
.ring { transform: rotate(-90deg); }
.ring-track { stroke: var(--surface-3); }
.ring-val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }

.stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.statlet { padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.statlet .v { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 30px; line-height: 1; }
.statlet .l { font-size: 11.5px; color: var(--text-2); margin-top: 6px; font-weight: 500; }

/* attention list */
.attn { display: flex; flex-direction: column; }
.attn-item {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center;
  padding: 15px 4px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: background .15s; border-radius: 6px;
}
.attn-item:last-child { border-bottom: none; }
.attn-item:hover { background: var(--surface-2); }
.attn-bar { width: 4px; height: 38px; border-radius: 4px; align-self: center; }
.attn-name { font-weight: 600; font-size: 14px; }
.attn-line { font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.4; }
.attn-val { text-align: right; }
.attn-val .v { font-family: var(--font-mono); font-weight: 600; font-size: 16px; }
.attn-val .r { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }

/* today checklist */
.check {
  display: flex; align-items: center; gap: 11px; padding: 9px 4px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
}
.check:last-child { border-bottom: none; }
.check-box {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-strong);
  display: grid; place-items: center; flex: none; transition: all .15s; color: transparent;
}
.check.done .check-box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.check.done .check-name { color: var(--text-3); text-decoration: line-through; }
.check-box svg { width: 13px; height: 13px; }
.check-name { font-size: 13.5px; font-weight: 500; }
.check-dose { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-family: var(--font-mono); }
.ampm-tabs { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.ampm-tabs button { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.ampm-tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* reorder alert */
.reorder {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); margin-bottom: 8px;
}
.reorder.urgent { border-color: color-mix(in srgb, var(--high) 35%, var(--border)); background: var(--high-weak); }
.reorder.warn { border-color: color-mix(in srgb, var(--watch) 35%, var(--border)); background: var(--watch-weak); }
.reorder .days { font-family: var(--font-mono); font-weight: 700; font-size: 19px; min-width: 30px; text-align: center; }

/* mini habit strip */
.habit-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.habit {
  display: flex; align-items: center; gap: 10px; padding: 12px;
  border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border);
}
.habit .hi { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; flex: none; }
.habit .hi svg { width: 17px; height: 17px; }
.habit .hn { font-size: 12.5px; font-weight: 600; }
.habit .hd { font-size: 11px; color: var(--text-3); margin-top: 1px; }
@media (max-width:760px){ .habit-strip{ grid-template-columns: 1fr 1fr; } .stat-row{grid-template-columns:1fr 1fr 1fr;} }

/* ============================================================
   LAB RESULTS
   ============================================================ */
.lab-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.group-panel { margin-bottom: 14px; }
.group-head {
  display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  transition: background .15s;
}
.group-head:hover { background: var(--surface-2); }
.group-head.open { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }
.group-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; flex: none; }
.group-ico svg { width: 20px; height: 20px; }
.group-name { font-weight: 700; font-size: 15.5px; }
.group-blurb { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.group-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chev { transition: transform .25s var(--ease); color: var(--text-3); }
.chev.open { transform: rotate(90deg); }

.group-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; background: var(--surface); }

.marker {
  border-bottom: 1px solid var(--border);
}
.marker:last-child { border-bottom: none; }
.marker-row {
  display: grid; grid-template-columns: 16px 1fr 130px 150px 88px 24px; gap: 14px; align-items: center;
  padding: 14px 20px; cursor: pointer; transition: background .15s;
}
.marker-row:hover { background: var(--surface-2); }
.marker-name { font-weight: 600; font-size: 14px; }
.marker-full { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.marker-val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.marker-val .v { font-size: 17px; font-weight: 600; }
.marker-val .u { font-size: 11px; color: var(--text-3); margin-left: 4px; }
.marker-ref { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }

/* range track viz */
.range-track { position: relative; height: 6px; border-radius: 6px; background: var(--surface-3); }
.range-band { position: absolute; height: 100%; border-radius: 6px; background: var(--ok-weak); }
.range-dot { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%,-50%); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong); }

/* explainer expand */
.explainer { overflow: hidden; max-height: 0; transition: max-height .35s var(--ease); }
.explainer.open { max-height: 640px; }
.explainer-inner { padding: 4px 20px 22px 50px; }
.exp-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 6px; }
@media (max-width: 820px){ .exp-grid { grid-template-columns: 1fr; } .marker-row{ grid-template-columns: 1fr auto 24px; } .marker-ref-cell,.range-cell{ display:none; } }
.exp-field .exp-label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.exp-field p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--text-2); }
.lab-note {
  margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--border-strong);
  background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 12.5px; color: var(--text-2); font-style: italic;
}

/* ---------- inline mini-trend in marker explainer ---------- */
.mini-trend { margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.mini-trend .mt-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mini-trend .mt-title { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--text-3); }
.mini-trend .mt-dates { display: flex; justify-content: space-between; margin-top: 6px; }
.mini-trend .mt-dates span { font-size: 10px; font-family: var(--font-mono); color: var(--text-3); }

/* ---------- connections block ---------- */
.connections { margin-top: 16px; padding: 16px; border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid var(--accent-line); }
.conn-head { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--on-accent-soft); display: flex; align-items: center; gap: 6px; }
.conn-note { font-size: 12.5px; color: var(--text-2); line-height: 1.55; margin: 8px 0 12px; }
.conn-rows { display: flex; flex-direction: column; gap: 9px; }
.conn-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: start; }
.conn-label { font-size: 11px; font-weight: 700; color: var(--text-3); padding-top: 6px; }
.conn-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.conn-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text);
  transition: border-color .15s, transform .08s, background .15s;
}
.conn-chip:hover { border-color: var(--accent); background: var(--surface-2); }
.conn-chip:active { transform: translateY(1px); }
@media (max-width: 560px){ .conn-row { grid-template-columns: 1fr; gap: 4px; } .conn-label { padding-top: 0; } }

/* ============================================================
   GENETICS
   ============================================================ */
.gene-row {
  display: grid; grid-template-columns: 14px 1fr 120px 150px 24px; gap: 14px; align-items: center;
  padding: 15px 20px; cursor: pointer; transition: background .15s;
}
.gene-row:hover { background: var(--surface-2); }
.gene-name { font-weight: 700; font-size: 14.5px; }
.gene-meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; font-family: var(--font-mono); }
.gene-geno { display: inline-flex; align-items: center; gap: 7px; }
.gene-geno .gt { font-family: var(--font-mono); font-weight: 700; font-size: 15px; padding: 2px 9px; border-radius: 6px; background: var(--surface-3); }
.gene-effect { font-size: 12px; color: var(--text-2); }
@media (max-width: 820px){ .gene-row { grid-template-columns: 1fr auto 24px; } .gene-effect-cell, .gene-geno-cell { display: none; } }

/* ============================================================
   SUPPLEMENTS
   ============================================================ */
.supp-summary { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
@media (max-width:900px){ .supp-summary{ grid-template-columns:1fr 1fr; } }
.supp-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
@media (max-width:760px){ .supp-grid{ grid-template-columns:1fr; } }

.supp-card { padding: 18px 20px; position: relative; overflow: hidden; }
.supp-card .topline { display: flex; align-items: flex-start; gap: 12px; }
.supp-name { font-weight: 700; font-size: 15px; }
.supp-brand { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.supp-note { font-size: 12.5px; color: var(--text-2); line-height: 1.5; margin-top: 12px; }
.supp-days { text-align: right; margin-left: auto; }
.supp-days .n { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 40px; line-height: .9; }
.supp-days .lbl { font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.supp-meta { display: flex; align-items: center; gap: 16px; margin: 14px 0 12px; font-size: 12px; color: var(--text-2); }
.supp-meta b { color: var(--text); font-weight: 600; }
.supp-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.dose-pills { display: flex; gap: 6px; }
.dose-pill { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.edge { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.edge.ok{background:var(--ok)} .edge.watch{background:var(--watch)} .edge.high{background:var(--high)}

/* schedule table */
.sched { width: 100%; border-collapse: collapse; }
.sched th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.sched th.dose, .sched td.dose { text-align: center; width: 80px; }
.sched td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.sched tr:last-child td { border-bottom: none; }
.sched .sname { font-weight: 600; }
.sched .sbrand { font-size: 11.5px; color: var(--text-3); }
.sched .dosecell { font-family: var(--font-mono); font-weight: 600; }
.sched .dosecell.zero { color: var(--text-3); font-weight: 400; }
.sched tbody tr:hover { background: var(--surface-2); }

/* ============================================================
   TRAINING
   ============================================================ */
.train-week { display: grid; grid-template-columns: repeat(7,1fr); gap: 10px; }
@media (max-width:1000px){ .train-week{ grid-template-columns: repeat(2,1fr); } }
.train-day { padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); min-height: 160px; display: flex; flex-direction: column; }
.train-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.train-day .dlabel { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.train-day .dfocus { font-weight: 700; font-size: 13.5px; margin: 8px 0 4px; }
.train-day .ddur { font-size: 11.5px; color: var(--text-2); font-family: var(--font-mono); }
.train-day ul { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.train-day li { font-size: 11.5px; color: var(--text-2); padding-left: 12px; position: relative; line-height: 1.35; }
.train-day li::before { content: ""; position: absolute; left: 0; top: 7px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.type-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.t-strength{background:var(--accent)} .t-zone2{background:var(--low)} .t-mobility{background:var(--ok)} .t-rest{background:var(--text-3)}
.train-day .done-tag { margin-top: auto; padding-top: 10px; }

.metric-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
@media (max-width:900px){ .metric-grid{ grid-template-columns:1fr 1fr; } }
.metric { padding: 18px; }
.metric .mv { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 38px; line-height: 1; }
.metric .mv .mu { font-size: 14px; color: var(--text-3); font-family: var(--font-ui); margin-left: 5px; }
.metric .ml { font-size: 12px; color: var(--text-2); margin-top: 5px; font-weight: 500; }
.metric .mt { font-size: 11.5px; margin-top: 8px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.metric .mnote { font-size: 11px; color: var(--text-3); margin-top: 8px; line-height: 1.4; }

/* ============================================================
   TRENDS
   ============================================================ */
.trend-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
@media (max-width:820px){ .trend-grid{ grid-template-columns:1fr; } }
.trend-card { padding: 18px 20px; }
.trend-card .th { display: flex; align-items: baseline; justify-content: space-between; }
.trend-card .tname { font-weight: 700; font-size: 14px; }
.trend-card .tval { font-family: var(--font-mono); font-weight: 600; font-size: 20px; }
.spark-wrap { margin-top: 14px; position: relative; }
.empty-state {
  text-align: center; padding: 60px 24px; border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg); background: var(--surface);
}
.empty-state .ei { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; margin: 0 auto 18px; }
.empty-state .ei svg { width: 28px; height: 28px; }

/* ============================================================
   RECORDS / DATABASE
   ============================================================ */
.rec-table { width: 100%; border-collapse: collapse; }
.rec-table th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.rec-table td { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.rec-table tr:last-child td { border-bottom: none; }
.rec-table tbody tr { cursor: pointer; transition: background .15s; }
.rec-table tbody tr:hover { background: var(--surface-2); }
.rec-current { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--accent); }

.dropzone {
  border: 2px dashed var(--border-strong); border-radius: var(--radius-lg);
  padding: 40px 24px; text-align: center; background: var(--surface-2);
  transition: all .2s; cursor: pointer;
}
.dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
.dropzone .di { width: 50px; height: 50px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; }
.dropzone .di svg { width: 24px; height: 24px; }

.kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; }
.kv { padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.kv .k { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.kv .v { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 26px; margin-top: 4px; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; background: rgba(8,16,12,.55);
  display: grid; place-items: center; padding: 20px;
  animation: fade .2s ease;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop); width: 100%; max-width: 440px; padding: 26px;
  animation: pop .3s var(--ease);
}
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
.modal h3 { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 24px; margin: 0 0 4px; }
.field { margin-top: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 13px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
  font-size: 14px; font-family: var(--font-mono); outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }

/* ============================================================
   LIVE VITALS (Overview)
   ============================================================ */
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); position: relative; box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); }
@media (prefers-reduced-motion: no-preference){ .live-dot { animation: livepulse 2s var(--ease) infinite; } }
@keyframes livepulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)} 70%{box-shadow:0 0 0 7px transparent} 100%{box-shadow:0 0 0 0 transparent} }
.live-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 1180px){ .live-grid { grid-template-columns: repeat(4,1fr); } }
@media (max-width: 980px){ .live-grid { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 680px){ .live-grid { grid-template-columns: repeat(2,1fr); } }
.live-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lt-ico { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; }
.lt-src { font-size: 9.5px; font-weight: 600; color: var(--text-3); display: inline-flex; align-items: center; gap: 4px; max-width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.src-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.lt-val { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 27px; line-height: 1.05; margin-top: 10px; letter-spacing: -.01em; }
.lt-unit { font-size: 12px; color: var(--text-3); font-family: var(--font-ui); font-weight: 500; margin-left: 4px; }
.lt-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.lt-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.lt-spark { width: 90px; opacity: .9; }
.lt-delta { font-size: 10.5px; font-weight: 600; text-align: right; }

/* locked tile — metric from a device that isn't connected */
.live-tile.locked { background: var(--surface-2); border-style: dashed; cursor: pointer; justify-content: space-between; }
.live-tile.locked:hover { border-color: var(--accent); }
.live-tile.locked .lt-ico { background: var(--surface-3); color: var(--text-3); }
.live-tile.locked .lt-val { color: var(--text-3); }
.lt-connect { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--accent); margin-top: 8px; }

/* upload empty-state */
.upload-state { text-align: center; padding: 44px 28px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow); }
.upload-state .ei { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-weak); color: var(--accent); display: grid; place-items: center; margin: 0 auto 18px; }
.upload-state .ei svg { width: 28px; height: 28px; }
.us-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: clamp(22px, 3vw, 28px); line-height: 1.15; }
.us-desc { font-size: 14px; color: var(--text-2); line-height: 1.6; max-width: 480px; margin: 10px auto 0; }
.upload-state .dropzone { max-width: 460px; margin-left: auto; margin-right: auto; }

/* ============================================================
   DEVICES
   ============================================================ */
.dev-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
@media (max-width: 760px){ .dev-grid { grid-template-columns: 1fr; } }
.dev-card { padding: 20px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.dev-top { display: flex; align-items: flex-start; gap: 14px; }
.dev-logo { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
.dev-name { font-weight: 700; font-size: 16px; }
.dev-model { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.dev-provides { display: flex; flex-wrap: wrap; gap: 6px; }
.dev-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.dev-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 14px; }
.toggle { width: 44px; height: 25px; border-radius: 20px; background: var(--border-strong); position: relative; transition: background .2s; flex: none; }
.toggle.on { background: var(--accent); }
.toggle i { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle.on i { transform: translateX(19px); }

/* ============================================================
   ADMIN
   ============================================================ */
.admin-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
.link-row { display: grid; grid-template-columns: 180px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.link-row:last-child { border-bottom: none; }
.link-row .lr-name { font-weight: 600; font-size: 13.5px; }
.link-row .lr-brand { font-size: 11.5px; color: var(--text-3); }
.link-input { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 12.5px; font-family: var(--font-mono); outline: none; transition: border-color .15s, box-shadow .15s; }
.link-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.link-input::placeholder { color: var(--text-3); }
@media (max-width: 720px){ .link-row { grid-template-columns: 1fr; gap: 6px; } }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: none; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (

});

const STATUS = {

  QUALITATIVE:{ label: "—",              badge: "badge-benign", dot: "dot-benign", cvar: "var(--benign)" },
};
function statusOf(m) { return STATUS[m.status] || STATUS.QUALITATIVE; }

/* ---------- range position 0..1 for the dot ---------- */
function rangePos(m) {
  if (m.refLow == null && m.refHigh == null) return null;
  const lo = m.refLow, hi = m.refHigh;
  if (lo != null && hi != null) {
    const span = hi - lo; const pad = span * 0.5;
    const min = lo - pad, max = hi + pad;
    return { pos: clamp((m.value - min) / (max - min), 0.02, 0.98), bandL: pad / (span + 2 * pad), bandR: (pad + span) / (span + 2 * pad) };
  }
  if (hi != null) { const max = hi * 1.6; return { pos: clamp(m.value / max, 0.02, 0.98), bandL: 0, bandR: hi / max }; }
  const min = lo * 0.5, max = lo * 2.0; return { pos: clamp((m.value - min) / (max - min), 0.02, 0.98), bandL: (lo - min) / (max - min), bandR: 1 };
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ---------- supplement depletion ---------- */
function daysRemaining(s, today) {
  const daily = s.amDose + s.pmDose;
  const elapsed = Math.max(0, window.VITALS.daysBetween(s.lastRestockedDate, today));
  const liveQty = Math.max(0, s.currentQuantity - elapsed * daily);
  const days = Math.floor(liveQty / daily);
  const runOut = new Date(today + "T00:00:00"); runOut.setDate(runOut.getDate() + days);
  return { daily, liveQty, days, runOut: runOut.toISOString().slice(0, 10), pct: clamp(liveQty / s.unitsPerContainer, 0, 1) };
}
function depState(days, threshold) {

/* ---------- Sparkline with reference band ---------- */
function Sparkline({ points, refLow, refHigh, accent, w = 280, h = 80, good }) {
  if (!points || points.length < 2) return null;
  const vals = points.map(p => p.v);
  const lo = Math.min(...vals, refLow ?? Infinity);
  const hi = Math.max(...vals, refHigh ?? -Infinity);
  const pad = (hi - lo) * 0.18 || 1;
  const min = lo - pad, max = hi + pad;
  const x = i => (i / (points.length - 1)) * (w - 10) + 5;
  const y = v => h - 8 - ((v - min) / (max - min)) * (h - 16);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const area = path + ` L${x(points.length - 1)} ${h - 4} L${x(0)} ${h - 4} Z`;
  const bandTop = refHigh != null ? y(refHigh) : 0;
  const bandBot = refLow != null ? y(refLow) : h;
  const id = "g" + Math.random().toString(36).slice(2, 7);
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: "block" }}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={accent} stopOpacity="0.22" />
          <stop offset="100%" stopColor={accent} stopOpacity="0" />
        </linearGradient>
      </defs>
      {(refLow != null || refHigh != null) &&
        <rect x="0" y={bandTop} width={w} height={Math.max(2, bandBot - bandTop)} fill="var(--ok)" opacity="0.10" />}
      <path d={area} fill={`url(#${id})`} />
      <path d={path} fill="none" stroke={accent} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (
        <circle key={i} cx={x(i)} cy={y(p.v)} r={i === points.length - 1 ? 4 : 2.6}
          fill={i === points.length - 1 ? accent : "var(--surface)"} stroke={accent} strokeWidth="1.8" />
      ))}
    </svg>
  );
}

/* ---------- Progress ring ---------- */
function Ring({ pct, size = 92, stroke = 9, color = "var(--accent)" }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  return (
    <svg className="ring" width={size} height={size}>
      <circle className="ring-track" cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth={stroke} />
      <circle className="ring-val" cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth={stroke}
        stroke={color} strokeDasharray={c} strokeDashoffset={off} />
    </svg>
  );
}

function ConnRow({ label, children }) {

function UploadModal({ title, desc, accept, note, onClose, onUpload }) {

function refText(m) {
  if (m.refLow != null && m.refHigh != null) return `${m.refLow}–${m.refHigh}`;
  if (m.refHigh != null) return `< ${m.refHigh}`;
  if (m.refLow != null) return `> ${m.refLow}`;
  return "—";
}
function unitShort(u, n) {
  if (u === "CAPSULE") return n === 1 ? "cap" : "caps";
  if (u === "SCOOP") return "scoop";
  if (u === "ML") return "mL";
  if (u === "CUBE") return n === 1 ? "cube" : "cubes";
  return "";
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function LiveVitals({ connections, nav }) {
  const devices = window.VITALS.devices;
  const isConn = id => (connections && id in connections) ? connections[id] : (devices.find(d => d.id === id) || {}).connected;
  const metrics = window.VITALS.liveMetrics.filter(m => isConn(m.source));
  const connDevices = devices.filter(d => isConn(d.id));
  const offDevices = devices.filter(d => !isConn(d.id));
  const dirColor = g => g === "up" ? "var(--ok)" : g === "down" ? "var(--ok)" : "var(--text-3)";

  return (
    <div style={{ marginBottom: 18 }}>
      <div className="row" style={{ justifyContent: "space-between", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
        <div className="row gap10">
          <span className="live-dot" /><span className="eyebrow" style={{ color: "var(--text-2)" }}>Live vitals</span>
          <span className="muted3" style={{ fontSize: 12 }}>
            {connDevices.length > 0 ? `Synced from ${connDevices.map(d => d.name).join(", ")}` : "No devices connected"}
          </span>
        </div>
        <button className="btn btn-sm btn-ghost" onClick={() => nav("devices")}><Icon name="signal" size={14} /> Manage devices</button>
      </div>

      {metrics.length === 0 ? (
        <div className="empty-state" style={{ padding: "36px 24px" }}>
          <div className="ei"><Icon name="watch" size={26} /></div>
          <div style={{ fontWeight: 600 }}>Connect a device to see live vitals</div>
          <div className="muted3" style={{ fontSize: 12.5, marginTop: 4 }}>Apple Watch, Oura, WHOOP, Withings and more.</div>
          <button className="btn btn-primary btn-sm" style={{ marginTop: 14 }} onClick={() => nav("devices")}><Icon name="plug" size={14} /> Connect a device</button>
        </div>
      ) : (
        <div className="live-grid">
          {metrics.map(m => {
            const dev = devices.find(d => d.id === m.source);
            return (
              <div className="live-tile" key={m.id}>
                <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div className="lt-ico"><Icon name={m.icon} size={16} /></div>
                  <span className="lt-src" title={dev.name}><span className="src-dot" style={{ background: dev.color }} />{dev.name}</span>
                </div>
                <div className="lt-val num">{m.value}<span className="lt-unit">{m.unit}</span></div>
                <div className="lt-label">{m.label}</div>
                <div className="lt-foot">
                  <div className="lt-spark"><Sparkline points={m.spark.map(v => ({ v }))} accent={"var(--accent)"} w={90} h={26} /></div>
                  <span className="lt-delta" style={{ color: dirColor(m.good) }}>{m.delta}</span>
                </div>
              </div>
            );
          })}
          {offDevices.map(d => (
            <div className="live-tile locked" key={d.id} onClick={() => nav("devices")}>
              <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-start" }}>
                <div className="lt-ico"><Icon name={d.icon} size={16} /></div>
                <span className="lt-src"><Icon name="plug" size={11} /> Not linked</span>
              </div>
              <div className="lt-val" style={{ fontSize: 15, lineHeight: 1.25, marginTop: 12 }}>{d.provides[0]}</div>
              <div className="lt-label" style={{ marginTop: 2 }}>via {d.name}</div>
              <div className="lt-connect"><Icon name="plus" size={12} /> Connect {d.name}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { Overview, LiveVitals, refText, unitShort, cap });

</script>

<script type="text/babel" data-presets="react">
/* ============================================================
   Vitals — Lab Results page
   ============================================================ */
function LabResults({ incoming, accent, nav }) {
  const groups = window.VITALS.groups;
  const markers = window.VITALS.markers;
  const [filter, setFilter] = React.useState(incoming?.filter || "all");
  const [query, setQuery] = React.useState("");
  const [open, setOpen] = React.useState(() => {
    const o = {}; groups.forEach(g => o[g.id] = true); return o;
  });
  const [openMarker, setOpenMarker] = React.useState(incoming?.open || null);

  React.useEffect(() => {
    if (incoming?.filter) setFilter(incoming.filter);
    if (incoming?.open) {
      setOpenMarker(incoming.open);
      const m = markers.find(x => x.id === incoming.open);
      if (m) setOpen(o => ({ ...o, [m.group]: true }));
    }
  }, [incoming]);

  const matches = (m) => {
    if (filter === "flagged" && (m.status === "IN_RANGE")) return false;
    if (query && !((m.name + " " + m.short).toLowerCase().includes(query.toLowerCase()))) return false;
    return true;
  };

  const visibleGroups = groups
    .map(g => ({ g, items: markers.filter(m => m.group === g.id && matches(m)) }))
    .filter(x => x.items.length > 0);

  const flaggedCount = markers.filter(m => m.status !== "IN_RANGE").length;

  return (
    <div className="content stagger">
      <div className="card card-pad" style={{ marginBottom: 18, display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap" }}>
        <div className="group-ico" style={{ width: 42, height: 42 }}><Icon name="link" size={21} /></div>
        <div style={{ flex: 1, minWidth: 220 }}>
          <div className="card-title" style={{ fontSize: 15.5 }}>An integrative record — not just numbers</div>
          <div className="muted" style={{ fontSize: 13, marginTop: 3 }}>Open any marker for a plain-language read, its trend across draws, and how it links to your genetics and supplement protocol.</div>
        </div>
        <button className="btn btn-sm" onClick={() => nav("genetics")}><Icon name="dna" size={15} /> View genetics</button>
      </div>
      <div className="lab-toolbar">
        <div className="search" style={{ minWidth: 260 }}>
          <Icon name="search" size={16} />
          <input placeholder="Search markers — TPO, vitamin D, cholesterol…" value={query} onChange={e => setQuery(e.target.value)} />
        </div>
        <div className="row gap6">
          {[["all", "All markers"], ["flagged", `Flagged (${flaggedCount})`]].map(([k, l]) => (
            <button key={k} className={"chip" + (filter === k ? " active" : "")} onClick={() => setFilter(k)}>{l}</button>
          ))}
        </div>
        <div className="topbar-spacer" />
        <button className="btn btn-sm" onClick={() => {
          const allOpen = Object.values(open).every(Boolean);
          const o = {}; groups.forEach(g => o[g.id] = !allOpen); setOpen(o);
        }}>
          {Object.values(open).every(Boolean) ? "Collapse all" : "Expand all"}
        </button>
      </div>

      {visibleGroups.length === 0 &&
        <div className="empty-state"><div className="muted">No markers match your search.</div></div>}

      {visibleGroups.map(({ g, items }) => (
        <div className="group-panel" key={g.id}>
          <div className={"group-head" + (open[g.id] ? " open" : "")} onClick={() => setOpen(o => ({ ...o, [g.id]: !o[g.id] }))}>
            <div className="group-ico"><Icon name={g.icon} size={20} /></div>
            <div style={{ minWidth: 0 }}>
              <div className="group-name">{g.name}</div>
              <div className="group-blurb">{g.blurb}</div>
            </div>
            <div className="group-meta">
              <GroupChips items={items} />
              <Icon name="chevR" size={18} style={{}} />
            </div>
          </div>
          {open[g.id] && (
            <div className="group-body">
              {items.map(m => (
                <MarkerRow key={m.id} m={m} open={openMarker === m.id} accent={accent} nav={nav}
                  onToggle={() => setOpenMarker(openMarker === m.id ? null : m.id)} />
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function GroupChips({ items }) {
  const flagged = items.filter(m => m.status !== "IN_RANGE" && m.status !== "BENIGN_FLAG").length;
  return (
    <div className="row gap6">
      {flagged > 0
        ? <span className="badge badge-watch">{flagged} flagged</span>
        : <span className="badge badge-ok"><span className="dot dot-ok" /> all clear</span>}
      <span className="muted3" style={{ fontSize: 12, fontFamily: "var(--font-mono)" }}>{items.length}</span>
    </div>
  );
}

function MarkerRow({ m, open, onToggle, accent, nav }) {
  const st = statusOf(m);
  const rp = rangePos(m);
  const hist = window.VITALS.history[m.id];
  const meta = window.VITALS.trendMeta[m.id];
  let improving = null;
  if (hist && meta) { const delta = hist[hist.length - 1].v - hist[0].v; improving = meta.dir === "down-good" ? delta < 0 : delta > 0; }
  const corr = window.VITALS.correlations[m.id];
  return (
    <div className="marker">
      <div className="marker-row" onClick={onToggle}>
        <span className="dot" style={{ width: 9, height: 9, borderRadius: "50%", background: st.cvar }} />
        <div style={{ minWidth: 0 }}>
          <div className="marker-name">{m.short}</div>
          <div className="marker-full">{m.name}</div>
        </div>
        <div className="marker-val">
          <span className="v" style={{ color: m.status === "IN_RANGE" ? "var(--text)" : st.cvar }}>{m.value}</span>
          <span className="u">{m.unit}</span>
        </div>
        <div className="range-cell">
          {rp ? (
            <div className="range-track">
              <div className="range-band" style={{ left: (rp.bandL * 100) + "%", width: ((rp.bandR - rp.bandL) * 100) + "%" }} />
              <div className="range-dot" style={{ left: (rp.pos * 100) + "%", background: st.cvar }} />
            </div>
          ) : <div className="muted3" style={{ fontSize: 11 }}>—</div>}
        </div>
        <div className="marker-ref-cell">
          <span className={"badge " + st.badge}>{st.label}</span>
        </div>
        <Icon name="chevD" size={18} style={{ color: "var(--text-3)", transform: open ? "rotate(180deg)" : "none", transition: "transform .25s" }} />
      </div>
      <div className={"explainer" + (open ? " open" : "")}>
        <div className="explainer-inner">
          <div className="row gap16 wrap" style={{ marginBottom: 6 }}>
            <div className="kv" style={{ background: "var(--surface-2)", padding: "8px 12px" }}>
              <div className="k">Your result</div>
              <div style={{ fontFamily: "var(--font-mono)", fontWeight: 600, fontSize: 18, color: st.cvar }}>{m.value} <span style={{ fontSize: 12, color: "var(--text-3)" }}>{m.unit}</span></div>
            </div>
            <div className="kv" style={{ background: "var(--surface-2)", padding: "8px 12px" }}>
              <div className="k">Reference</div>
              <div style={{ fontFamily: "var(--font-mono)", fontWeight: 600, fontSize: 18 }}>{refText(m)} <span style={{ fontSize: 12, color: "var(--text-3)" }}>{m.unit}</span></div>
            </div>
          </div>
          <div className="exp-grid">
            <div className="exp-field"><div className="exp-label">What it is</div><p>{m.explainer.whatItIs}</p></div>
            <div className="exp-field"><div className="exp-label">Why it matters</div><p>{m.explainer.whyItMatters}</p></div>
            <div className="exp-field"><div className="exp-label">What yours suggests</div><p>{m.explainer.whatYoursSuggests}</p></div>
          </div>
          {hist && hist.length > 1 && (
            <div className="mini-trend">
              <div className="mt-head">
                <span className="mt-title">Trend · last {hist.length} draws</span>
                {improving !== null && (
                  <span className="badge" style={{ background: improving ? "var(--ok-weak)" : "var(--watch-weak)", color: improving ? "var(--ok)" : "var(--watch)" }}>
                    <Icon name={hist[hist.length - 1].v < hist[0].v ? "arrowDown" : "arrowUp"} size={11} />{improving ? "improving" : "watch"}
                  </span>
                )}
              </div>
              <Sparkline points={hist} refLow={m.refLow} refHigh={m.refHigh} accent={"var(--accent)"} w={320} h={70} />
              <div className="mt-dates">{hist.map((p, i) => <span key={i}>{window.VITALS.fmtDate(p.d, { month: "short", year: "2-digit" })}</span>)}</div>
            </div>
          )}
          <Connections corr={corr} nav={nav} />
          {m.labNote && <div className="lab-note"><b style={{ fontStyle: "normal", color: "var(--text-3)" }}>Lab note · </b>{m.labNote}</div>}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { LabResults });

</script>

<script type="text/babel" data-presets="react">

function Supplements({ today, overrides, setOverride, linkOf, nav }) {

function Trends({ accent, nav }) {

  const panels = window.VITALS.panels;

  return (
    <div className="content stagger">

        </div>
      </div>

      <div className="trend-grid">
        {ids.map(id => {
          const m = markers.find(x => x.id === id);
          const pts = hist[id];
          const meta = window.VITALS.trendMeta[id];
          const first = pts[0].v, last = pts[pts.length - 1].v;
          const delta = last - first;
          const improving = meta.dir === "down-good" ? delta < 0 : delta > 0;
          const st = m ? statusOf(m) : STATUS.IN_RANGE;
          return (
            <div className="card trend-card" key={id}>
              <div className="th">
                <div>
                  <div className="tname">{m ? m.short : id}</div>

                    <span className="badge" style={{ background: improving ? "var(--ok-weak)" : "var(--high-weak)", color: improving ? "var(--ok)" : "var(--high)" }}>

                  </div>
                </div>
              </div>
              <div className="spark-wrap">
                <Sparkline points={pts} refLow={m?.refLow} refHigh={m?.refHigh} accent={"var(--accent)"} w={300} h={84} />
                <div className="row" style={{ justifyContent: "space-between", marginTop: 8 }}>
                  {pts.map((p, i) => <span key={i} className="muted3" style={{ fontSize: 10.5, fontFamily: "var(--font-mono)" }}>{window.VITALS.fmtDate(p.d, { month: "short", year: "2-digit" })}</span>)}

              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

}/*EDITMODE-END*/;

];

const PAGE_META = {
  overview:    { title: "Overview",            sub: "How you're doing, and what to do today" },
  labs:        { title: "Lab Results",         sub: "Every marker, translated into plain language" },

  supplements: { title: "Supplement Protocol", sub: "Your daily stack and depletion countdown" },

  devices:     { title: "Devices",             sub: "Connect wearables and feed live data in" },
  admin:       { title: "Admin",               sub: "Reorder links, protocol defaults, and data" },
};

function usePersist(key, init) {
  const [v, setV] = uS(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  uE(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [v]);
  return [v, setV];
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = uS("overview");

  const [taken, setTaken] = usePersist("vitals.taken", {});
  const [overrides, setOverrides] = usePersist("vitals.overrides", {});
  const [connections, setConnections] = usePersist("vitals.devices", {});
  const [linkOverrides, setLinkOverrides] = usePersist("vitals.links", {});
  const [uploads, setUploads] = usePersist("vitals.uploads", { genetics: true });
  const [seenDisclaimer, setSeenDisclaimer] = usePersist("vitals.disclaimer", false);

  const today = new Date().toISOString().slice(0, 10);

  // apply theme to <html>
  uE(() => {
    const r = document.documentElement;

    if (acc && acc.color) r.style.setProperty("--accent-override", acc.color);
    else r.style.removeProperty("--accent-override");

  const nav = (key, params) => { setPage(key); setIncoming(params || null); window.scrollTo({ top: 0 }); };

  const setOverride = (id, patch) => setOverrides(prev => ({ ...prev, [id]: { ...(prev[id] || {}), ...patch } }));

  // devices + reorder links
  const connOf = id => (id in connections) ? connections[id] : (window.VITALS.devices.find(d => d.id === id) || {}).connected;
  const connMap = {}; window.VITALS.devices.forEach(d => { connMap[d.id] = connOf(d.id); });
  const setConn = (id, v) => setConnections(prev => ({ ...prev, [id]: v }));
  const linkOf = id => (id in linkOverrides) ? linkOverrides[id] : (window.VITALS.reorderLinks[id] || "");
  const setLink = (id, url) => setLinkOverrides(prev => ({ ...prev, [id]: url }));
  const setUpload = (key, val) => setUploads(prev => ({ ...prev, [key]: val }));

  // reorder badge count
  const lowCount = window.VITALS.supplements
    .map(s => ({ ...s, ...(overrides[s.id] || {}) }))

                {n.key === "supplements" && lowCount > 0 && <span className="nav-badge">{lowCount}</span>}
              </button>
            ))}

        <div className="nav-spacer" />
        <div className="nav-foot">
          <div className="avatar">JM</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>Jonah Mirsky</div>
            <div className="muted3" style={{ fontSize: 11 }}>Last draw · {window.VITALS.fmtDate("2026-05-25", { month: "short", day: "numeric" })}</div>

      </aside>

        {page === "records" && <Records nav={nav} />}

          diagnose, prescribe, or replace your physician.
        </p>
        <p className="muted" style={{ fontSize: 13.5, lineHeight: 1.6, marginTop: 10 }}>
          The plain-language explainers describe what each marker means in general terms. Anything genuinely concerning is
          a conversation to have with your doctor. Your data stays on this device — no accounts, no analytics, no external calls.
        </p>
        <div className="row" style={{ justifyContent: "flex-end", marginTop: 22 }}>
          <button className="btn btn-primary" onClick={onClose}><Icon name="check" size={15} /> Got it</button>
        </div>
      </div>
    </div>
  );
}

/* Honest placeholder for modules that aren't backed by real data yet. */
function ComingSoon({ icon, title, desc }) {
  return (
    <div className="content stagger">
      <div className="upload-state">
        <div className="ei"><Icon name={icon || "spark"} size={28} /></div>
        <div className="us-title">{title}</div>
        {desc && <div className="us-desc">{desc}</div>}
        <div className="row gap8" style={{ justifyContent: "center", marginTop: 18 }}>
          <span className="badge badge-benign"><Icon name="clock" size={12} /> Coming soon</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
